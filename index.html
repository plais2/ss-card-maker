<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SS Card Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700;900&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Anakotmai';
  src: url('Anakotmai-Bold.otf') format('opentype');
  font-weight: bold;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --orange: #e85d04;
  --navy:   #1b3a4b;
  --bg:     #0d0d1a;
  --panel:  #111120;
  --card:   #18182e;
  --border: #1e1e3a;
  --muted:  #555;
  --text:   #ddd;
}
html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

/* ── HEADER ── */
.app-header {
  height: 52px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px; background: var(--panel); border-bottom: 1px solid var(--border);
  flex-shrink: 0; z-index: 20; position: relative;
}
.app-title { font-size: 16px; font-weight: 800; color: var(--orange); letter-spacing: .5px; }
.app-title span { color: #fff; font-weight: 400; }
.btn-dl {
  background: var(--orange); color: #fff; border: none; border-radius: 8px;
  padding: 7px 20px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background .2s;
}
.btn-dl:hover { background: #c74d00; }

/* ── MAIN LAYOUT ── */
.app-body {
  display: grid;
  grid-template-columns: 1fr 320px;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* ── PREVIEW PANE ── */
.preview-pane {
  display: flex; align-items: center; justify-content: center;
  background: #08080f; overflow: hidden; padding: 16px;
}
#canvas {
  border-radius: 10px;
  box-shadow: 0 16px 60px rgba(0,0,0,.75);
  max-width: 100%; max-height: 100%;
  display: block; cursor: default;
}

/* ── CONTROLS PANE ── */
.controls-pane {
  display: flex; flex-direction: column;
  background: var(--panel); border-left: 1px solid var(--border);
  overflow-y: auto; overflow-x: hidden;
}
.controls-pane::-webkit-scrollbar { width: 4px; }
.controls-pane::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }

/* ── SECTION ── */
.ctrl-section {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 8px;
}
.section-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1.5px; color: var(--orange); margin-bottom: 2px;
}

/* ── UPLOAD CHIPS ── */
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  display: flex; align-items: center; gap: 5px;
  background: var(--card); border: 1.5px dashed #2e2e5e;
  border-radius: 8px; padding: 7px 10px; font-size: 12px; color: #aaa;
  cursor: pointer; position: relative; overflow: hidden;
  transition: border-color .2s, color .2s; white-space: nowrap;
}
.chip:hover { border-color: var(--orange); color: var(--orange); }
.chip.loaded { border-color: #3daa6e; border-style: solid; color: #3daa6e; }
.chip input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.chip .chip-icon { font-size: 15px; }
.chip .chip-name { font-size: 10px; color: inherit; display: block; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── OVERLAY LIST ── */
.ov-list { display: flex; flex-direction: column; gap: 6px; }
.ov-item {
  display: flex; align-items: center; gap: 8px;
  background: var(--card); border: 1.5px solid var(--border);
  border-radius: 8px; padding: 6px 8px; cursor: pointer;
  transition: border-color .2s;
}
.ov-item:hover  { border-color: #6a3fac; }
.ov-item.active { border-color: #9b59b6; background: #1a0f2e; }
.ov-thumb {
  width: 40px; height: 40px; object-fit: cover;
  border-radius: 5px; flex-shrink: 0; border: 1px solid #2e2e5e;
}
.ov-info { flex: 1; min-width: 0; }
.ov-name { font-size: 11px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-size-row { display: flex; align-items: center; gap: 4px; margin-top: 3px; }
.ov-size-row input[type=range] { flex: 1; accent-color: #9b59b6; height: 3px; }
.ov-size-val { font-size: 10px; color: #9b59b6; min-width: 28px; text-align: right; }
.ov-del {
  background: none; border: none; color: #555; font-size: 15px;
  cursor: pointer; padding: 2px 4px; border-radius: 4px; flex-shrink: 0;
  transition: color .2s;
}
.ov-del:hover { color: #e85d04; }

.sm-btn {
  background: var(--card); border: 1px solid var(--border);
  color: var(--muted); border-radius: 6px; padding: 5px 10px;
  font-size: 11px; cursor: pointer; transition: border-color .2s, color .2s;
}
.sm-btn:hover { border-color: #9b59b6; color: #9b59b6; }

/* ── TEXT AREA ── */
#textInput {
  width: 100%; min-height: 140px; background: var(--card);
  border: 1.5px solid var(--border); color: #fff;
  border-radius: 8px; padding: 10px 12px; font-size: 14px;
  line-height: 1.65; outline: none; resize: vertical;
  font-family: 'Noto Sans Thai', sans-serif; transition: border-color .2s;
}
#textInput:focus { border-color: var(--orange); }
#textInput::placeholder { color: #444; font-size: 12px; line-height: 1.5; }
.hint-box {
  background: #0a0a1e; border: 1px solid var(--border); border-radius: 6px;
  padding: 7px 10px; font-size: 10.5px; color: #555; line-height: 1.8;
}
.hint-box b { color: #888; }
.hint-box code { color: #7a9fff; background: var(--border); padding: 0 4px; border-radius: 3px; }

/* ── BG PREVIEW ── */
.bg-preview {
  position: relative; border-radius: 8px; overflow: hidden;
  height: 160px; background: #0f0f20;
  border: 2px solid #2e2e5e;
}
.bg-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bg-preview .spin {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px; font-size: 24px;
}
.bg-preview .spin .dot { font-size: 11px; color: #888; }
.bg-preview .style-tag {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,.7); color: #ccc; font-size: 11px;
  padding: 4px 8px; text-align: center;
}
.bg-options { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: 100%; height: 100%; padding: 0; }
.bg-option-item {
  position: relative; cursor: pointer; border-radius: 6px; overflow: hidden;
  border: 2px solid transparent; transition: border-color .15s; background: #111;
  display: flex; flex-direction: column;
}
.bg-option-item img { width: 100%; flex: 1; object-fit: cover; min-height: 0; display: block; }
.bg-option-item:hover { border-color: rgba(232,93,4,.6); }
.bg-option-item.selected { border-color: var(--orange); }
.bg-option-item.failed { opacity: .35; cursor: default; }
.bg-option-item .spin { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 18px; }
.bg-opt-label { font-size: 10px; text-align: center; padding: 3px 4px; background: rgba(0,0,0,.75); color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
.bg-btn-row { display: flex; gap: 6px; }
.bg-gen-btn {
  flex: 1; background: linear-gradient(135deg, #1a0a2e, #2a1a4e);
  border: 1.5px solid #9b59b6; color: #c39bd3; border-radius: 8px;
  padding: 9px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
  transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 5px;
}
.bg-gen-btn:hover { background: linear-gradient(135deg, #2a0a4e, #3a2a6e); color: #fff; }
.bg-gen-btn:disabled { opacity: .4; cursor: not-allowed; }
.bg-use-btn {
  background: #3daa6e; border: none; color: #fff; border-radius: 8px;
  padding: 9px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
  transition: background .2s; white-space: nowrap; display: none;
}
.bg-use-btn:hover { background: #2d8a5e; }
.bg-use-btn.show { display: block; }

/* ── Full Preview Modal ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.92); align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-img {
  max-width: 95vw; max-height: 95vh;
  border-radius: 12px; box-shadow: 0 20px 80px rgba(0,0,0,0.8);
}
.modal-close {
  position: fixed; top: 16px; right: 16px;
  background: rgba(255,255,255,0.15); color: #fff; border: none;
  border-radius: 50%; width: 40px; height: 40px; font-size: 20px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}

/* ── Toggle preview button (mobile only) ── */
.btn-toggle-preview {
  display: none;
  background: #1e1e3a; color: #aaa; border: 1px solid #2e2e5e;
  border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  transition: all .2s; white-space: nowrap;
}
.btn-toggle-preview.active { background: var(--orange); color: #fff; border-color: var(--orange); }

/* ── RESPONSIVE ── */
@media (max-width: 860px) {
  .btn-toggle-preview { display: block; }
  .app-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .controls-pane { grid-row: 1; border-left: none; border-bottom: 1px solid var(--border); max-height: 56vh; overflow-y: auto; }
  .preview-pane  { grid-row: 2; padding: 10px; transition: max-height .3s ease, opacity .3s ease; }
  .preview-pane.hidden { max-height: 0 !important; overflow: hidden; opacity: 0; padding: 0; }
  .controls-pane.expanded { max-height: calc(100vh - 52px); }
}
@media (max-width: 500px) {
  .controls-pane { max-height: 60vh; }
  .app-header { padding: 0 12px; }
  .btn-dl { padding: 6px 12px; font-size: 12px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<!-- Full Preview Modal -->
<div class="modal-overlay" id="previewModal" onclick="closeModal()">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <img class="modal-img" id="modalImg">
</div>

<header class="app-header">
  <div class="app-title">SS <span>Card Maker</span></div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="btn-toggle-preview" id="togglePreviewBtn" onclick="togglePreview()">🙈 ซ่อน</button>
    <button class="btn-toggle-preview active" onclick="openModal()" style="display:flex">👁 เต็มจอ</button>
    <button class="btn-dl" onclick="download()">⬇ Download</button>
  </div>
</header>

<!-- MAIN -->
<div class="app-body">

  <!-- PREVIEW -->
  <div class="preview-pane" id="previewPane">
    <canvas id="canvas"></canvas>
  </div>

  <!-- CONTROLS -->
  <div class="controls-pane">

    <!-- TEXT (บนสุด) -->
    <div class="ctrl-section">
      <div class="section-label">✍ ข้อความบน Card</div>
      <textarea id="textInput"
        placeholder="TH-AI Passport&#10;1,621 ล้าน&#10;&#10;แบบไม่มีรายละเอียด เรื่อง AI&#10;แต่ดันไปละเอียดเรื่องจอโฆษณา?"
        oninput="render()"></textarea>
      <button onclick="formatText()" id="fmtBtn"
        style="width:100%;background:linear-gradient(135deg,#1a2a1a,#2a4a2a);
               border:1.5px solid #3daa6e;color:#7dda9e;border-radius:8px;
               padding:8px;font-size:12px;font-weight:700;cursor:pointer;
               display:flex;align-items:center;justify-content:center;gap:6px;
               transition:all .2s">
        ✨ จัดรูปแบบข้อความให้สวย
      </button>
      <div id="fmtStatus" style="font-size:10px;color:#555;text-align:center;min-height:14px"></div>
      <div class="hint-box">
        <b>บรรทัดใหญ่</b> → พิมพ์ปกติ<br>
        เว้น <code>1 บรรทัดว่าง</code> → <b>บรรทัดเล็ก</b><br>
        ฟอนต์ <b>Anakotmai</b> • auto-size ตามกว้าง
      </div>
    </div>

    <!-- AI SUGGEST BG -->
    <div class="ctrl-section">
      <div class="section-label">✨ AI แนะนำ BG</div>
      <div class="bg-preview" id="bgPreview">
        <div class="spin"><span>🤖</span><span class="dot">กดปุ่มด้านล่างเพื่อสร้าง</span></div>
      </div>
      <div id="genStatus" style="font-size:11px;color:var(--muted);text-align:center;min-height:16px"></div>
      <div id="hfTokenSection" style="display:none;margin:6px 0 8px">
        <div style="font-size:10px;color:#888;margin-bottom:4px">ต้องการ <a href="https://huggingface.co/settings/tokens" target="_blank" style="color:#4285f4">HuggingFace Token (ฟรี)</a> — New token → Read</div>
        <div style="display:flex;gap:6px">
          <input id="hfTokenInput" type="password" placeholder="hf_..." style="flex:1;padding:5px 8px;background:#0d1117;border:1px solid #444;border-radius:6px;color:#fff;font-size:11px">
          <button onclick="saveHFToken()" style="padding:5px 10px;background:#3daa6e;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:11px;white-space:nowrap">บันทึก</button>
        </div>
      </div>
      <div class="bg-btn-row">
        <button class="bg-gen-btn" id="genBtn" onclick="genOneBG()">⚡ Auto Gen</button>
        <button class="bg-gen-btn" id="geminiBtn" onclick="openGemini()"
          style="border-color:#4285f4;color:#7ab4ff;background:linear-gradient(135deg,#0a1428,#1a2a4e)">
          <img src="https://www.gstatic.com/lamda/images/gemini_sparkle_v002_d4735304ff6292a690345.svg"
            style="width:14px;height:14px;filter:brightness(2)" onerror="this.style.display='none'">
          Gemini
        </button>
      </div>
    </div>

    <!-- UPLOADS -->
    <div class="ctrl-section">
      <div class="section-label">Layers</div>
      <div class="chip-row">

        <!-- BG -->
        <label class="chip" id="bgChip" title="Layer 3 — รูปพื้นหลัง">
          <span class="chip-icon">📷</span>
          <div><div style="font-size:12px">BG</div><div class="chip-name" id="bgName">พื้นหลัง</div></div>
          <input type="file" accept="image/*" onchange="loadLayer(this,'bg')">
        </label>

        <!-- Overlay Add -->
        <label class="chip" title="เพิ่มรูป Overlay (ได้หลายรูป)">
          <span class="chip-icon">🖼</span>
          <div><div style="font-size:12px">+ แทรกรูป</div><div class="chip-name">เพิ่มได้หลายรูป</div></div>
          <input type="file" accept="image/*" multiple onchange="loadL25(this)">
        </label>

      </div>
    </div>

    <!-- OVERLAY LIST -->
    <div class="ctrl-section" id="overlaySection" style="display:none">
      <div class="section-label">🖼 แทรกรูป — ลากบน Preview เพื่อย้าย</div>
      <div class="ov-list" id="ovList"></div>
    </div>

  </div>
</div>

<!-- HIDDEN inputs for JS -->
<input type="hidden" id="fontBig"   value="0">
<input type="hidden" id="fontSmall" value="0">
<input type="hidden" id="footerPct" value="81">

<script>
// ══════════════════════════════════════════
//  MOBILE PREVIEW TOGGLE
// ══════════════════════════════════════════
let previewVisible = true;
function togglePreview() {
  previewVisible = !previewVisible;
  const pane = document.getElementById('previewPane');
  const ctrl = document.querySelector('.controls-pane');
  const btn  = document.getElementById('togglePreviewBtn');
  pane.classList.toggle('hidden', !previewVisible);
  ctrl.classList.toggle('expanded', !previewVisible);
  btn.textContent = previewVisible ? '🙈 ซ่อน' : '👁 แสดง';
  if (previewVisible) setTimeout(render, 320);
}

function openModal() {
  render();
  const canvas = document.getElementById('canvas');
  document.getElementById('modalImg').src = canvas.toDataURL('image/jpeg', 0.95);
  document.getElementById('previewModal').classList.add('open');
}

function closeModal() {
  document.getElementById('previewModal').classList.remove('open');
}

// ══════════════════════════════════════════
//  FONT
// ══════════════════════════════════════════
let fontReady = false;
async function loadFont() {
  try {
    const f = new FontFace('Anakotmai', 'url(Anakotmai-Bold.otf)', { weight: 'bold' });
    await f.load(); document.fonts.add(f); fontReady = true;
  } catch(e) { fontReady = false; }
}
const fontStr = sz => fontReady ? `bold ${sz}px Anakotmai` : `900 ${sz}px 'Noto Sans Thai',sans-serif`;

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
const L = { bg: null, template: null };

// overlays array — แต่ละรูปเป็น object อิสระ
let overlays   = [];
let activeIdx  = -1; // index ที่เลือกอยู่ (สำหรับ crop)
let ovDrag     = { on: false, idx: -1, ox: 0, oy: 0 };
let cropDraw   = { on: false, sx: 0, sy: 0, x: 0, y: 0, w: 0, h: 0 };

// ══════════════════════════════════════════
//  LAYER LOADING
// ══════════════════════════════════════════
function loadImg(src, cb) {
  const i = new Image(); i.onload = () => cb(i); i.onerror = () => cb(null); i.src = src;
}
function loadLayer(input, type) {
  if (!input.files[0]) return;
  const file = input.files[0];
  loadImg(URL.createObjectURL(file), img => {
    if (!img) return;
    if (type === 'bg') { L.bg = img; document.getElementById('bgChip').classList.add('loaded'); document.getElementById('bgName').textContent = file.name; }
    render();
  });
  input.value = '';
}
// ดึงหัวข้อหลัก + หัวข้อรองจากข้อความในการ์ด
function extractCardText(text) {
  const lines = text.split('\n').map(l => l.trim());
  const blankIdx = lines.findIndex(l => l === '');
  let bigLines, smallLines;
  if (blankIdx > 0) {
    bigLines  = lines.slice(0, blankIdx).filter(Boolean);
    smallLines = lines.slice(blankIdx + 1).filter(Boolean);
  } else {
    bigLines  = lines.slice(0, 2).filter(Boolean);
    smallLines = lines.slice(2).filter(Boolean);
  }
  return {
    headline: bigLines.join(' ').slice(0, 40) || 'ราชการไทย',
    subtopic: (smallLines[0] || bigLines[1] || '').slice(0, 35) || 'เอกสารราชการ',
  };
}

// ══════════════════════════════════════════
//  AI GENERATE BG (Pollinations.ai)
// ══════════════════════════════════════════

// วิเคราะห์ scene จากข้อความ — ดึง keyword เฉพาะจากเนื้อหาโดยตรง
function extractBGScene(text) {
  const t = text.toLowerCase();
  const parts = [];

  // ── กระทรวง / หน่วยงานเฉพาะ ──
  if (/กระทรวงการคลัง|คลัง|งบประมาณ/.test(t))
    parts.push('abstract holographic gold financial data visualization floating in dark cinematic environment, warm gold teal glow');
  else if (/กระทรวงศึกษา|ศธ|โรงเรียน|มหาวิทยาลัย/.test(t))
    parts.push('dark dramatic educational hall interior, glowing holographic screens with academic data, soft cinematic blue light');
  else if (/กระทรวงกลาโหม|ทหาร|กองทัพ/.test(t))
    parts.push('dark dramatic defense interior, cold blue cinematic lighting, architectural shadows, no person no figure');
  else if (/กระทรวงสาธารณสุข|สธ|โรงพยาบาล|แพทย์/.test(t))
    parts.push('clean cinematic medical tech interior, holographic health data screens, soft blue diffused light, no person');
  else if (/กระทรวง|หน่วยงาน|สำนักงาน|กรม|สภา/.test(t))
    parts.push('empty government assembly hall dark dramatic interior, soft institutional blue glow, cinematic shadows');

  // ── เหตุการณ์ / การกระทำ ──
  if (/ประชุม|เห็นชอบ|ลงมติ|โหวต|มีมติ|อภิปราย/.test(t))
    parts.push('empty government assembly hall dramatic dark interior, vacant seats with name plates, glowing screens background, cinematic');
  if (/อนุมัติ|อนุญาต|ลงนาม|ลงชื่อ|เซ็น/.test(t))
    parts.push('dramatic dark corporate stage lone spotlight, holographic approval interface glow, cinematic shadows, no person');
  if (/กฎหมาย|พรบ|ระเบียบ|ประกาศ|คำสั่ง|ราชกิจจา/.test(t))
    parts.push('dark dramatic digital library wall of glowing document screens, rows of holographic files, cinematic blue light');
  if (/จัดสรร|งบ|ล้าน|พัน|บาท/.test(t))
    parts.push('abstract holographic gold financial data display in dark cinematic environment, warm gold and teal glow');

  // ── ธรรมชาติ / สถานที่ ──
  if (/ต้นไม้|tree|ป่า|forest/.test(t))   parts.push('dark cinematic forest bokeh, teal green light rays through canopy, shallow depth of field');
  if (/ทะเล|sea|ocean|ชายหาด/.test(t))    parts.push('dark cinematic ocean teal, dramatic waves bokeh, orange horizon glow, shallow depth of field');
  if (/ท้องฟ้า|sky|เมฆ|cloud/.test(t))    parts.push('dramatic cinematic sky deep blue orange sunset bokeh, golden hour warm glow');
  if (/ดาว|star|อวกาศ|space/.test(t))     parts.push('dark cinematic space deep blue purple galaxy bokeh, dramatic light rays');
  if (/เมือง|city|ตึก|building/.test(t))  parts.push('dark cinematic city bokeh, teal and orange neon reflection, shallow depth of field');

  // ── การเงิน ──
  if (/เงิน|finance|bank|ธนาคาร|หุ้น|ลงทุน/.test(t))
    parts.push('dark cinematic financial interior, abstract gold data hologram, polished marble reflection, no person');

  if (parts.length > 0) return parts.slice(0, 2).join(', ');
  return 'empty formal Thai government ceremonial hall, dark interior warm gold accent lighting, polished marble, cinematic';
}

// Rule-based fallback (ใช้ตอนไม่มี Claude API key)
function ruleBasedFormat(text) {
  const clean = text.trim().replace(/\n+/g, ' ').replace(/\s+/g, ' ');
  const breaks = /([?!？！]|\s+(?:แต่|และ|หรือ|จาก|โดย|เพราะ|เนื่องจาก|ส่วน|เมื่อ|เพื่อ|ด้วย|กับ)\s+)/g;
  const parts  = clean.split(breaks).map(p => p.trim()).filter(p => p && p.length > 2);
  if (parts.length <= 1) {
    if (clean.length > 30) {
      const mid = Math.floor(clean.length / 2);
      const sp  = clean.lastIndexOf(' ', mid);
      return clean.slice(0, sp || mid) + '\n\n' + clean.slice((sp || mid) + 1);
    }
    return clean;
  }
  return parts.slice(0, 2).join(' ').trim() + '\n\n' + parts.slice(2).join(' ').trim();
}

async function genSingleImg(prompt, isLocal, attempt = 0) {
  const seed = Math.floor(Math.random() * 999983);
  // attempt 0: flux-realism, attempt 1+: flux (เร็วกว่า เสถียรกว่า)
  const model = attempt === 0 ? 'flux-realism' : 'flux';
  let imgSrc;
  try {
    if (isLocal) {
      const r = await fetch('/gen-bg-image', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      if (!r.ok) { const t = await r.text(); throw new Error(`${r.status}: ${t.slice(0,80)}`); }
      imgSrc = (await r.json()).image;
    } else {
      const polUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}` +
        `?width=832&height=1216&nologo=true&seed=${seed}&model=${model}&enhance=false`;
      await new Promise((res, rej) => {
        const pi = new Image(); pi.onload = res;
        pi.onerror = () => rej(new Error('Pollinations ไม่ตอบสนอง'));
        pi.src = polUrl;
      });
      try {
        const resp = await fetch('https://images.weserv.nl/?url=' + encodeURIComponent(polUrl));
        if (!resp.ok) throw new Error(`weserv ${resp.status}`);
        const blob = await resp.blob();
        imgSrc = await new Promise(r => { const fr = new FileReader(); fr.onload = e => r(e.target.result); fr.readAsDataURL(blob); });
      } catch(e) { imgSrc = polUrl; }
    }
  } catch(e) {
    if (attempt < 2) {
      await new Promise(r => setTimeout(r, 5000));
      return genSingleImg(prompt, isLocal, attempt + 1);
    }
    throw e;
  }
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('โหลดรูปล้มเหลว'));
    img.src = imgSrc;
  });
}

async function genOneBG() {
  const text = document.getElementById('textInput').value.trim();
  if (!text) { setGenStatus('⚠️ พิมพ์ข้อความในการ์ดก่อน', '#e94560'); return; }

  const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

  const prev = document.getElementById('bgPreview');

  if (text !== lastGenText) { genStyleIdx = pickBGStyleIdx(text); lastGenText = text; }
  const idx1 = genStyleIdx % BG_STYLES.length;
  genStyleIdx++;

  // idx2: สุ่มจาก styles ที่เหลือ (ไม่ซ้ำ idx1)
  const otherIdxs = Array.from({length: BG_STYLES.length}, (_, i) => i).filter(i => i !== idx1);
  const idx2 = otherIdxs[Math.floor(Math.random() * otherIdxs.length)];

  btn.disabled = true; btn.innerHTML = '⏳ 0s';

  // สร้าง grid ก่อน — populate ทีละ slot เมื่อรูปพร้อม
  prev.innerHTML = `<div class="bg-options" id="bgOptGrid"></div>`;
  const grid = document.getElementById('bgOptGrid');
  [idx1, idx2].forEach((si, i) => {
    const slot = document.createElement('div');
    slot.className = 'bg-option-item'; slot.id = `bgOpt${i}`;
    slot.innerHTML = `<div class="spin"><span>🎨</span><span class="dot">${BG_STYLES[si % BG_STYLES.length].label}</span></div>`;
    grid.appendChild(slot);
  });

  setGenStatus('กำลังสร้างรูป…', '#e85d04');

  const buildPrompt = (i) => {
    const s = BG_STYLES[i % BG_STYLES.length];
    const sceneStyle = s.prompt(text);
    const neg = s.type === 'hall'
      ? 'no person no human no figure no silhouette no face no animal no bird no insect no plant no text no words'
      : 'no person no human no figure no silhouette no face no animal no bird no insect no plant';
    return `${sceneStyle}, ${GOV_STYLE}, ${neg}`;
  };

  let elapsed = 0;
  const timer = setInterval(() => { elapsed++; btn.innerHTML = `⏳ ${elapsed}s`; }, 1000);
  let firstApplied = false;

  const fillSlot = (slotIdx, styleIdx, img) => {
    const { label } = BG_STYLES[styleIdx % BG_STYLES.length];
    const slot = document.getElementById(`bgOpt${slotIdx}`);
    if (!slot) return;
    slot.innerHTML = `<img src="${img.src}"><div class="bg-opt-label">${label}</div>`;
    slot.addEventListener('click', () => {
      document.querySelectorAll('.bg-option-item').forEach(el => el.classList.remove('selected'));
      slot.classList.add('selected');
      L.bg = img;
      document.getElementById('bgChip').classList.add('loaded');
      document.getElementById('bgName').textContent = '✨ AI Generated';
      setGenStatus(`✅ ${label} — เลือกแล้ว`, '#3daa6e');
      render();
    });
    if (!firstApplied) {
      firstApplied = true; slot.classList.add('selected');
      L.bg = img; pendingBGImg = img;
      document.getElementById('bgChip').classList.add('loaded');
      document.getElementById('bgName').textContent = '✨ AI Generated';
      render();
    }
  };

  const failSlot = (slotIdx, styleIdx) => {
    const { label } = BG_STYLES[styleIdx % BG_STYLES.length];
    const slot = document.getElementById(`bgOpt${slotIdx}`);
    if (slot) { slot.innerHTML = `<div class="spin"><span>❌</span></div><div class="bg-opt-label">${label}</div>`; slot.classList.add('failed'); }
  };

  // Sequential + หน่วง 2s ระหว่างสองรูปเพื่อป้องกัน rate-limit
  try {
    setGenStatus('กำลังสร้างรูปที่ 1…', '#e85d04');
    fillSlot(0, idx1, await genSingleImg(buildPrompt(idx1), isLocal));
    setGenStatus('รูป 1 สำเร็จ — กำลังสร้างรูปที่ 2…', '#e85d04');
  } catch(e) {
    failSlot(0, idx1);
    setGenStatus('รูป 1 ไม่สำเร็จ — กำลังสร้างรูปที่ 2…', '#888');
  }
  await new Promise(r => setTimeout(r, 2000));
  try {
    fillSlot(1, idx2, await genSingleImg(buildPrompt(idx2), isLocal));
  } catch(e) { failSlot(1, idx2); }

  clearInterval(timer);
  btn.disabled = false; btn.innerHTML = '🔄 สร้างใหม่';
  setGenStatus(firstApplied ? `✅ เลือกรูปได้เลย — ${elapsed}s` : '❌ สร้างรูปไม่สำเร็จ',
               firstApplied ? '#3daa6e' : '#e94560');
}

// ══════════════════════════════════════════
//  OVERLAY — ARRAY-BASED
// ══════════════════════════════════════════
function newOverlay(img, name) {
  const W = L.template ? L.template.naturalWidth  : 1080;
  const H = L.template ? L.template.naturalHeight : 1350;
  const dw = Math.round(W * 0.5);
  const dh = Math.round(dw * img.height / img.width);
  return {
    image: img, name,
    cx: 0, cy: 0, cw: img.width, ch: img.height,
    px: Math.round((W - dw) / 2),
    py: Math.round(H * 0.2),
    dw, dh, sizePct: 50,
  };
}

function loadL25(input) {
  const files = Array.from(input.files); if (!files.length) return;
  let done = 0;
  files.forEach(file => {
    loadImg(URL.createObjectURL(file), img => {
      if (img) overlays.push(newOverlay(img, file.name));
      if (++done === files.length) {
        activeIdx = overlays.length - 1;
        renderOverlayList();
        setActiveOverlay(activeIdx);
        render();
      }
    });
  });
  input.value = '';
}

function removeOverlay(idx) {
  overlays.splice(idx, 1);
  if (activeIdx >= overlays.length) activeIdx = overlays.length - 1;
  renderOverlayList();
  if (activeIdx >= 0) setActiveOverlay(activeIdx); else hideCropEditor();
  render();
}

function setActiveOverlay(idx) {
  activeIdx = idx;
  renderOverlayList();
  if (idx < 0 || !overlays[idx]) { hideCropEditor(); return; }
  document.getElementById('cropEditor').style.display = '';
  initCropCanvas();
}

function hideCropEditor() {
  document.getElementById('cropEditor').style.display = 'none';
}

// ── Render sidebar list ──
function renderOverlayList() {
  const list = document.getElementById('ovList');
  const sec  = document.getElementById('overlaySection');
  list.innerHTML = '';
  if (!overlays.length) { sec.style.display = 'none'; return; }
  sec.style.display = '';

  overlays.forEach((ov, i) => {
    const item = document.createElement('div');
    item.className = 'ov-item' + (i === activeIdx ? ' active' : '');
    item.onclick = () => setActiveOverlay(i);

    // Thumbnail
    const thumb = document.createElement('img');
    thumb.className = 'ov-thumb';
    // draw cropped thumb
    const tc = document.createElement('canvas');
    const srcW = ov.cw || ov.image.width, srcH = ov.ch || ov.image.height;
    tc.width = 80; tc.height = Math.round(80 * srcH / srcW);
    tc.getContext('2d').drawImage(ov.image, ov.cx, ov.cy, srcW, srcH, 0, 0, tc.width, tc.height);
    thumb.src = tc.toDataURL();

    // Info + size slider
    const info = document.createElement('div');
    info.className = 'ov-info';
    info.innerHTML = `<div class="ov-name">${ov.name}</div>
      <div class="ov-size-row">
        <input type="range" min="5" max="100" value="${ov.sizePct}"
          oninput="onOvSize(${i},this)" onclick="e=>e.stopPropagation()">
        <div class="ov-size-val">${ov.sizePct}%</div>
      </div>`;

    // Delete
    const del = document.createElement('button');
    del.className = 'ov-del'; del.textContent = '✕';
    del.onclick = e => { e.stopPropagation(); removeOverlay(i); };

    item.appendChild(thumb); item.appendChild(info); item.appendChild(del);
    list.appendChild(item);
  });
}

function onOvSize(idx, el) {
  const ov = overlays[idx]; if (!ov) return;
  const pct = parseInt(el.value);
  ov.sizePct = pct;
  el.nextElementSibling.textContent = pct + '%';
  const W = L.template ? L.template.naturalWidth : 1080;
  ov.dw = Math.round(W * pct / 100);
  ov.dh = Math.round(ov.dw * (ov.ch || ov.image.height) / (ov.cw || ov.image.width));
  render();
}

// ── Crop canvas ──
function initCropCanvas() {
  const cc = document.getElementById('cropCanvas');
  if (!cc) return;
  cc.onmousedown  = onCropDown; cc.onmousemove  = onCropMove; cc.onmouseup    = onCropUp;
  cc.ontouchstart = e => { e.preventDefault(); onCropDown(e.touches[0]); };
  cc.ontouchmove  = e => { e.preventDefault(); onCropMove(e.touches[0]); };
  cc.ontouchend   = e => { e.preventDefault(); onCropUp(); };
  drawCropCanvas(0, 0, 0, 0);
}

function cropPt(e) {
  const cc = document.getElementById('cropCanvas'), r = cc.getBoundingClientRect(), sc = cc.width / r.width;
  return { x: (e.clientX - r.left) * sc, y: (e.clientY - r.top) * sc };
}

function drawCropCanvas(sx, sy, sw, sh) {
  const cc = document.getElementById('cropCanvas');
  const ov = overlays[activeIdx];
  if (!cc || !ov) return;
  const maxW = cc.parentElement.clientWidth || 280;
  const dsc  = maxW / ov.image.width;
  cc.width = Math.round(ov.image.width * dsc); cc.height = Math.round(ov.image.height * dsc);
  const ctx = cc.getContext('2d');
  ctx.drawImage(ov.image, 0, 0, cc.width, cc.height);
  if (sw > 4 && sh > 4) {
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, cc.width, cc.height);
    ctx.drawImage(ov.image, sx/dsc, sy/dsc, sw/dsc, sh/dsc, sx, sy, sw, sh);
    ctx.strokeStyle = '#9b59b6'; ctx.lineWidth = 2;
    ctx.setLineDash([6, 3]); ctx.strokeRect(sx, sy, sw, sh); ctx.setLineDash([]);
    [[sx,sy],[sx+sw,sy],[sx,sy+sh],[sx+sw,sy+sh]].forEach(([hx,hy]) => {
      ctx.fillStyle = '#9b59b6'; ctx.fillRect(hx-5, hy-5, 10, 10);
    });
  }
}
function onCropDown(e) {
  const p = cropPt(e); cropDraw.on = true; cropDraw.sx = p.x; cropDraw.sy = p.y;
  cropDraw.x = p.x; cropDraw.y = p.y; cropDraw.w = 0; cropDraw.h = 0;
}
function onCropMove(e) {
  if (!cropDraw.on) return;
  const p = cropPt(e);
  cropDraw.x = Math.min(p.x, cropDraw.sx); cropDraw.y = Math.min(p.y, cropDraw.sy);
  cropDraw.w = Math.abs(p.x - cropDraw.sx); cropDraw.h = Math.abs(p.y - cropDraw.sy);
  drawCropCanvas(cropDraw.x, cropDraw.y, cropDraw.w, cropDraw.h);
}
function onCropUp() {
  if (!cropDraw.on) return; cropDraw.on = false;
  const ov = overlays[activeIdx]; if (!ov) return;
  const cc = document.getElementById('cropCanvas'), dsc = cc.width / ov.image.width;
  if (cropDraw.w > 6 && cropDraw.h > 6) {
    ov.cx = Math.round(cropDraw.x / dsc); ov.cy = Math.round(cropDraw.y / dsc);
    ov.cw = Math.round(cropDraw.w / dsc); ov.ch = Math.round(cropDraw.h / dsc);
    const W = L.template ? L.template.naturalWidth : 1080;
    ov.dw = Math.round(W * ov.sizePct / 100);
    ov.dh = Math.round(ov.dw * ov.ch / ov.cw);
    renderOverlayList();
  }
  render();
}

function resetCrop() {
  const ov = overlays[activeIdx]; if (!ov) return;
  ov.cx = 0; ov.cy = 0; ov.cw = ov.image.width; ov.ch = ov.image.height;
  const W = L.template ? L.template.naturalWidth : 1080;
  ov.dw = Math.round(W * ov.sizePct / 100); ov.dh = Math.round(ov.dw * ov.ch / ov.cw);
  drawCropCanvas(0, 0, 0, 0); renderOverlayList(); render();
}

// ── Canvas drag — ย้ายรูปได้ทุกรูป ──
function initCanvasEvents() {
  const cv = document.getElementById('canvas');
  cv.addEventListener('mousedown',  onCvDown);
  cv.addEventListener('mousemove',  onCvMove);
  cv.addEventListener('mouseup',    onCvUp);
  cv.addEventListener('mouseleave', onCvUp);
  cv.addEventListener('touchstart', e => { e.preventDefault(); onCvDown(e.touches[0]); }, { passive: false });
  cv.addEventListener('touchmove',  e => { e.preventDefault(); onCvMove(e.touches[0]); }, { passive: false });
  cv.addEventListener('touchend',   e => { e.preventDefault(); onCvUp(); });
}
function cvPt(e) {
  const cv = document.getElementById('canvas'), r = cv.getBoundingClientRect(), sc = cv.width / r.width;
  return { x: (e.clientX - r.left) * sc, y: (e.clientY - r.top) * sc };
}
function ovAt(x, y) {
  // หา overlay ล่างสุด (วาดทีหลัง = อยู่บนสุด) ที่ตำแหน่งนี้
  for (let i = overlays.length - 1; i >= 0; i--) {
    const o = overlays[i];
    if (x >= o.px && x <= o.px + o.dw && y >= o.py && y <= o.py + o.dh) return i;
  }
  return -1;
}
function onCvDown(e) {
  if (!overlays.length) return;
  const p = cvPt(e), i = ovAt(p.x, p.y);
  if (i >= 0) {
    ovDrag.on = true; ovDrag.idx = i;
    ovDrag.ox = p.x - overlays[i].px; ovDrag.oy = p.y - overlays[i].py;
    document.getElementById('canvas').style.cursor = 'grabbing';
    if (i !== activeIdx) { activeIdx = i; renderOverlayList(); setActiveOverlay(i); }
  }
}
function onCvMove(e) {
  const cv = document.getElementById('canvas');
  if (ovDrag.on) {
    const p = cvPt(e), o = overlays[ovDrag.idx];
    if (o) { o.px = p.x - ovDrag.ox; o.py = p.y - ovDrag.oy; render(); }
  } else {
    const p = cvPt(e); cv.style.cursor = ovAt(p.x, p.y) >= 0 ? 'grab' : 'default';
  }
}
function onCvUp() {
  ovDrag.on = false; document.getElementById('canvas').style.cursor = 'default';
}

// ══════════════════════════════════════════
//  CANVAS UTILS
// ══════════════════════════════════════════
function drawCover(ctx, img, x, y, w, h) {
  const sc = Math.max(w / img.width, h / img.height);
  ctx.drawImage(img, x + (w - img.width*sc)/2, y + (h - img.height*sc)/2, img.width*sc, img.height*sc);
}

function autoFontSize(ctx, lines, maxW, maxPx, minPx) {
  if (!lines.length) return maxPx;
  let sz = maxPx;
  while (sz > minPx) {
    ctx.font = fontStr(sz);
    if (lines.every(l => ctx.measureText(l).width <= maxW)) return sz;
    sz--;
  }
  return minPx;
}

// คำนวณ font size ทั้งคู่พร้อมกัน และจำกัดความสูงรวมไม่เกิน H/2
function calcFontSizes(ctx, bigLines, smLines, maxW, H) {
  let bigFs = autoFontSize(ctx, bigLines, maxW, Math.round(H * 0.12), 16);  // จำกัดกว้างก่อน
  let smFs  = autoFontSize(ctx, smLines,  maxW, Math.round(H * 0.072), 14);

  const secGap  = (bigLines.length && smLines.length) ? Math.round(bigFs * 0.12) : 0;
  const maxTextH = Math.round(H * 0.50); // ห้ามสูงเกินครึ่งรูป

  const totalH = () =>
    bigLines.length * Math.round(bigFs * 1.20) +
    smLines.length  * Math.round(smFs  * 1.22) +
    (bigLines.length && smLines.length ? Math.round(bigFs * 0.12) : 0);

  // ลด font ลงจนความสูงรวม ≤ H/2
  while (totalH() > maxTextH && (bigFs > 16 || smFs > 14)) {
    if (bigFs > 16) bigFs--;
    if (smFs  > 14) smFs--;
  }
  return { bigFs, smFs };
}

// ══════════════════════════════════════════
//  RENDER TEXT
// ══════════════════════════════════════════

// แยก big/small: ถ้ามีบรรทัดว่างคั่นใช้นั้น, ถ้าไม่มีให้ 2 บรรทัดแรก=ใหญ่ ที่เหลือ=เล็ก
function parseTextSections(raw) {
  if (/\n\s*\n/.test(raw)) {
    const parts = raw.split(/\n\s*\n/).map(s => s.split('\n').map(l => l.trim()).filter(Boolean)).filter(s => s.length);
    return { bigLines: parts[0] || [], smLines: parts.slice(1).flat() };
  }
  const all = raw.split('\n').map(l => l.trim()).filter(Boolean);
  return { bigLines: all.slice(0, 2), smLines: all.slice(2) };
}

// word-wrap สำหรับภาษาไทย (แยกตามตัวอักษร) + ภาษาอังกฤษ (แยกตามคำ)
function wrapLine(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return [text];
  const lines = []; let cur = '';
  // ลอง word-wrap ก่อน (สำหรับภาษาอังกฤษ)
  const words = text.split(' ');
  if (words.length > 1) {
    for (const word of words) {
      const test = cur ? cur + ' ' + word : word;
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = word; }
      else cur = test;
    }
  } else {
    // ภาษาไทย: แยกตามตัวอักษร
    for (const ch of text) {
      if (ctx.measureText(cur + ch).width > maxW && cur) { lines.push(cur); cur = ch; }
      else cur += ch;
    }
  }
  if (cur) lines.push(cur);
  return lines;
}

function renderText(ctx, W, H) {
  const raw = document.getElementById('textInput').value;
  if (!raw.trim()) return;

  const footerY   = Math.round(H * (parseInt(document.getElementById('footerPct').value) / 100));
  const gapFooter = Math.round(H * 0.002);
  const padX      = Math.round(W * 0.048);
  const maxW      = W - padX * 2;

  const { bigLines, smLines } = parseTextSections(raw);
  const { bigFs,   smFs   }   = calcFontSizes(ctx, bigLines, smLines, maxW, H);

  ctx.font = fontStr(bigFs);
  const bigWrapped = bigLines.flatMap(ln => wrapLine(ctx, ln, maxW));
  ctx.font = fontStr(smFs);
  const smWrapped  = smLines.flatMap(ln  => wrapLine(ctx, ln, maxW));

  const bigLH  = Math.round(bigFs * 1.20);
  const smLH   = Math.round(smFs  * 1.22);
  const secGap = (bigWrapped.length && smWrapped.length) ? Math.round(bigFs * 0.12) : 0;
  const totalH = bigWrapped.length * bigLH + smWrapped.length * smLH + secGap;

  let curY = footerY - gapFooter - totalH;
  ctx.textBaseline = 'top'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff';

  bigWrapped.forEach(ln => { ctx.font = fontStr(bigFs); ctx.fillText(ln, padX, curY); curY += bigLH; });
  curY += secGap;
  smWrapped.forEach(ln  => { ctx.font = fontStr(smFs);  ctx.fillText(ln, padX, curY); curY += smLH;  });
}

// ══════════════════════════════════════════
//  MAIN RENDER
// ══════════════════════════════════════════
function render() {
  const canvas = document.getElementById('canvas');
  const W = L.template ? L.template.naturalWidth  : 1080;
  const H = L.template ? L.template.naturalHeight : 1350;
  canvas.width = W; canvas.height = H;

  // Scale to pane
  const pane = document.getElementById('previewPane');
  const maxW = pane.clientWidth  - 32;
  const maxH = pane.clientHeight - 32;
  const sc   = Math.min(1, maxW / W, maxH / H);
  canvas.style.width  = Math.round(W * sc) + 'px';
  canvas.style.height = Math.round(H * sc) + 'px';

  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  // Layer 3: BG
  if (L.bg) {
    drawCover(ctx, L.bg, 0, 0, W, H);
  } else {
    ctx.fillStyle = '#1e1e30'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.font = `${Math.round(W * 0.035)}px Arial`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('← อัปโหลด BG', W / 2, H / 2);
  }

  // Layer 2.5: Overlays (หลัง template)
  overlays.forEach(o => {
    const sw = o.cw || o.image.width, sh = o.ch || o.image.height;
    ctx.drawImage(o.image, o.cx, o.cy, sw, sh, o.px, o.py, o.dw, o.dh);
  });

  // Layer 2: Template PNG
  if (L.template) {
    ctx.drawImage(L.template, 0, 0, W, H);
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.55, 'rgba(0,0,0,.6)'); g.addColorStop(1, 'rgba(0,0,0,.95)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // Overlay outlines — เฉพาะ activeIdx
  if (activeIdx >= 0 && overlays[activeIdx]) {
    const o = overlays[activeIdx];
    ctx.save();
    ctx.strokeStyle = 'rgba(155,89,182,0.8)'; ctx.lineWidth = 3;
    ctx.setLineDash([8, 4]); ctx.strokeRect(o.px, o.py, o.dw, o.dh); ctx.setLineDash([]);
    ctx.restore();
  }

  // Layer 1: Text
  renderText(ctx, W, H);
}

// ══════════════════════════════════════════
//  DOWNLOAD (ไม่มี outline)
// ══════════════════════════════════════════
function download() {
  // วาดใหม่โดยไม่มี outline
  const canvas = document.getElementById('canvas');
  const W = L.template ? L.template.naturalWidth  : 1080;
  const H = L.template ? L.template.naturalHeight : 1350;
  const offscreen = document.createElement('canvas');
  offscreen.width = W; offscreen.height = H;
  const ctx = offscreen.getContext('2d');

  if (L.bg) drawCover(ctx, L.bg, 0, 0, W, H);
  else { ctx.fillStyle = '#1e1e30'; ctx.fillRect(0, 0, W, H); }

  overlays.forEach(o => {
    const sw = o.cw || o.image.width, sh = o.ch || o.image.height;
    ctx.drawImage(o.image, o.cx, o.cy, sw, sh, o.px, o.py, o.dw, o.dh);
  });

  if (L.template) ctx.drawImage(L.template, 0, 0, W, H);
  else {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.55, 'rgba(0,0,0,.6)'); g.addColorStop(1, 'rgba(0,0,0,.95)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // Text (render onto offscreen)
  const savedCanvas = document.getElementById('canvas');
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = W; tempCanvas.height = H;
  // Use renderText directly on offscreen ctx
  renderTextOn(ctx, W, H);

  const a = document.createElement('a');
  a.download = 'ss-card.png';
  a.href = offscreen.toDataURL('image/png');
  a.click();
}

function renderTextOn(ctx, W, H) {
  const raw = document.getElementById('textInput').value;
  if (!raw.trim()) return;
  const footerY   = Math.round(H * (parseInt(document.getElementById('footerPct').value) / 100));
  const gapFooter = Math.round(H * 0.002);
  const padX = Math.round(W * 0.048);
  const maxW = W - padX * 2;
  const { bigLines, smLines } = parseTextSections(raw);
  const { bigFs, smFs }       = calcFontSizes(ctx, bigLines, smLines, maxW, H);
  ctx.font = fontStr(bigFs);
  const bigWrapped = bigLines.flatMap(ln => wrapLine(ctx, ln, maxW));
  ctx.font = fontStr(smFs);
  const smWrapped  = smLines.flatMap(ln  => wrapLine(ctx, ln, maxW));
  const bigLH = Math.round(bigFs * 1.20), smLH = Math.round(smFs * 1.22);
  const secGap = (bigWrapped.length && smWrapped.length) ? Math.round(bigFs * 0.12) : 0;
  const totalH = bigWrapped.length * bigLH + smWrapped.length * smLH + secGap;
  let curY = footerY - gapFooter - totalH;
  ctx.textBaseline = 'top'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
  bigWrapped.forEach(ln => { ctx.font = fontStr(bigFs); ctx.fillText(ln, padX, curY); curY += bigLH; });
  curY += secGap;
  smWrapped.forEach(ln  => { ctx.font = fontStr(smFs);  ctx.fillText(ln, padX, curY); curY += smLH;  });
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
window.addEventListener('load', async () => {
  await loadFont();
  tryAutoLoadTemplate();
  initCanvasEvents();
  render();
  new ResizeObserver(render).observe(document.getElementById('previewPane'));
  // โหลด HF token จาก local server อัตโนมัติ (ใช้เฉพาะ localhost)
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    try {
      const cfg = await fetch('/local-config').then(r => r.json());
      if (cfg.hfToken && !localStorage.getItem('hf_token')) {
        localStorage.setItem('hf_token', cfg.hfToken);
      }
    } catch(e) {}
  }
});
